{% extends 'base.html' %}

{% block title %}Bulk Attendance{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card shadow mb-4">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-calendar-check"></i> Bulk Attendance Marking</h4>
            </div>
            <div class="card-body">
                <form method="post" id="attendanceForm">
                    {% csrf_token %}
                    
                    <div class="row mb-4">
                        <div class="col-md-4">
                            <label for="{{ form.class_obj.id_for_label }}" class="form-label">Class *</label>
                            {{ form.class_obj }}
                        </div>
                        <div class="col-md-4">
                            <label for="{{ form.subject.id_for_label }}" class="form-label">Subject *</label>
                            {{ form.subject }}
                        </div>
                        <div class="col-md-4">
                            <label for="{{ form.date.id_for_label }}" class="form-label">Date *</label>
                            {{ form.date }}
                        </div>
                    </div>
                    
                    <button type="button" class="btn btn-info mb-3" onclick="loadStudents()">
                        <i class="bi bi-search"></i> Load Students
                    </button>
                    
                    <div id="studentList" style="display: none;">
                        <h5 class="mt-4 mb-3">Student List</h5>
                        <div class="table-responsive">
                            <table class="table table-bordered">
                                <thead class="table-light">
                                    <tr>
                                        <th>Student ID</th>
                                        <th>Student Name</th>
                                        <th>Status</th>
                                        <th>Remarks</th>
                                    </tr>
                                </thead>
                                <tbody id="studentRows">
                                    <!-- Will be populated by JavaScript -->
                                </tbody>
                            </table>
                        </div>
                        
                        <div class="mt-3">
                            <button type="button" class="btn btn-success me-2" onclick="markAll('present')">
                                <i class="bi bi-check-circle"></i> Mark All Present
                            </button>
                            <button type="button" class="btn btn-danger me-2" onclick="markAll('absent')">
                                <i class="bi bi-x-circle"></i> Mark All Absent
                            </button>
                            <button type="button" class="btn btn-warning" onclick="markAll('late')">
                                <i class="bi bi-clock"></i> Mark All Late
                            </button>
                        </div>
                        
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-save"></i> Save Attendance
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function loadStudents() {
    const classId = document.getElementById('{{ form.class_obj.id_for_label }}').value;
    if (!classId) {
        alert('Please select a class first');
        return;
    }
    
    // In a real application, you would make an AJAX call to get students
    // For now, we'll simulate with a prompt
    alert('In production, this would load students from the selected class via AJAX');
    
    // Show the student list section
    document.getElementById('studentList').style.display = 'block';
}

function markAll(status) {
    const radios = document.querySelectorAll('input[type="radio"][name$="_status"]');
    radios.forEach(radio => {
        if (radio.value === status) {
            radio.checked = true;
        }
    });
}

// Add this to make the class selection trigger loading
document.getElementById('{{ form.class_obj.id_for_label }}').addEventListener('change', loadStudents);
</script>
{% endblock %}
